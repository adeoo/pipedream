<text class="g-t" x="606" y="148" text-anchor="start" >52.000 to 52.030</text>
<text class="g-s g-pt" x="606" y="167" text-anchor="start" >furo do mancal</text>
<polyline class="g-thin" points="310.5,299.25 590,250 600,250" marker-start="url(#dot-brg)"/>
<text class="g-b" x="606" y="245" text-anchor="start" >Bearing 6205</text>
<text class="g-t" x="606" y="264" text-anchor="start" >25 x 52 x 15 mm</text>
<text class="g-s g-pt" x="606" y="283" text-anchor="start" >rolamento</text>
<polyline class="g-thin" points="470,372.5 520,490 600,490" marker-start="url(#dot-brg)"/>
<text class="g-b" x="606" y="485" text-anchor="start" >Shaft seat Ø25 k5</text>
<text class="g-t" x="606" y="504" text-anchor="start" >25.002 to 25.011</text>
<text class="g-s g-pt" x="606" y="523" text-anchor="start" >assento do eixo</text>
<polyline class="g-thin" points="150,355 200,490 250,490" marker-start="url(#dot-brg)"/>
<text class="g-b" x="30" y="485" text-anchor="start" >Shaft shoulder Ø30</text>
<text class="g-t" x="30" y="504" text-anchor="start" >at least da min = 30</text>
<text class="g-s g-pt" x="30" y="523" text-anchor="start" >encosto do eixo</text>
<polyline class="g-thin" points="215,265.5 215,120 200,120" marker-start="url(#dot-brg)"/>
<text class="g-b" x="30" y="115" text-anchor="start" >Housing shoulder</text>
<text class="g-t" x="30" y="134" text-anchor="start" >at most Da max = 47</text>
<text class="g-s g-pt" x="30" y="153" text-anchor="start" >encosto do mancal</text>
<text class="g-s" x="30" y="580" text-anchor="start" >Hatching = cut metal. The two shoulders touch only the bearing rings, never the seals.</text>
<text class="g-s" x="30" y="600" text-anchor="start" >Only the upper half is drawn. The lower half is the mirror image. Leaders below the axis point up to the shaft.</text>
