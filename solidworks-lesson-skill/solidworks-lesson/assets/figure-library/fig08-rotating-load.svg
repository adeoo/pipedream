<svg xmlns="http://www.w3.org/2000/svg" id="svg-load" viewBox="0 0 760 575" width="760" height="575" role="img" aria-label="Rotating inner ring versus rotating outer ring, and which ring gets the tight fit">
<title>Rotating inner ring versus rotating outer ring, and which ring gets the tight fit</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-load" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-load" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-load" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-load" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-load" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<pattern id="hR-load" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-60)"><rect width="5" height="5" fill="#f4f5f7"/><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2733" stroke-width="0.9"/></pattern>
<marker id="dot-load" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-load" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-load" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-load" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-load" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="575" fill="#ffffff"/>
<text class="g-h" x="380" y="30" text-anchor="middle" >Which ring turns against the load? That ring gets the tight fit.</text>
<path d="M78,205 a112,112 0 1,0 224,0 a112,112 0 1,0 -224,0 Z M98,205 a92,92 0 1,0 184,0 a92,92 0 1,0 -184,0 Z" fill="#2f6fde" fill-opacity=".28" fill-rule="evenodd" stroke="#2f6fde" stroke-width="2.4"/>
<path d="M124,205 a66,66 0 1,0 132,0 a66,66 0 1,0 -132,0 Z M142,205 a48,48 0 1,0 96,0 a48,48 0 1,0 -96,0 Z" fill="#c0392b" fill-opacity=".28" fill-rule="evenodd" stroke="#c0392b" stroke-width="2.4"/>
<circle cx="267.8" cy="191.3" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="240.8" cy="144.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="190.0" cy="126.0" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="139.2" cy="144.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="112.2" cy="191.3" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="121.6" cy="244.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="163.0" cy="279.2" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="217.0" cy="279.2" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="258.4" cy="244.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="190" cy="205" r="48" fill="url(#hS-load)" stroke="#1f8a4c" stroke-width="2"/>
<line class="g-cl" x1="60" y1="205" x2="320" y2="205" /><line class="g-cl" x1="190" y1="75" x2="190" y2="335" />
<path d="M160.6,188.0 A34,34 0 0,1 216.0,183.1" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrR-load)"/>
<line class="g-ink" x1="190" y1="355" x2="190" y2="395" style="stroke-width:3" marker-start="url(#arrs-load)"/>
<text class="g-b" x="200" y="391" text-anchor="start" >load, always this way</text>
<text class="g-b" x="190" y="440" text-anchor="middle" >Case 1: the shaft turns</text>
<text class="g-t" x="190" y="459" text-anchor="middle" >conveyor roller shaft, gearbox shaft</text>
<text class="g-t" x="190" y="478" text-anchor="middle" >inner ring turns, load stays still</text>
<text class="g-b" x="190" y="497" text-anchor="middle" >inner ring tight: shaft k5</text>
<text class="g-t" x="190" y="516" text-anchor="middle" >outer ring normal: housing H7</text>
<path d="M458,205 a112,112 0 1,0 224,0 a112,112 0 1,0 -224,0 Z M478,205 a92,92 0 1,0 184,0 a92,92 0 1,0 -184,0 Z" fill="#c0392b" fill-opacity=".28" fill-rule="evenodd" stroke="#c0392b" stroke-width="2.4"/>
<path d="M504,205 a66,66 0 1,0 132,0 a66,66 0 1,0 -132,0 Z M522,205 a48,48 0 1,0 96,0 a48,48 0 1,0 -96,0 Z" fill="#2f6fde" fill-opacity=".28" fill-rule="evenodd" stroke="#2f6fde" stroke-width="2.4"/>
<circle cx="647.8" cy="191.3" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="620.8" cy="144.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="570.0" cy="126.0" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="519.2" cy="144.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="492.2" cy="191.3" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="501.6" cy="244.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="543.0" cy="279.2" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="597.0" cy="279.2" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="638.4" cy="244.5" r="12" fill="#e7eaef" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="570" cy="205" r="48" fill="url(#hS-load)" stroke="#1f8a4c" stroke-width="2"/>
<line class="g-cl" x1="440" y1="205" x2="700" y2="205" /><line class="g-cl" x1="570" y1="75" x2="570" y2="335" />
<path d="M462.6,143.0 A124,124 0 0,1 665.0,125.3" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrR-load)"/>
<line class="g-ink" x1="570" y1="355" x2="570" y2="395" style="stroke-width:3" marker-start="url(#arrs-load)"/>
<text class="g-b" x="580" y="391" text-anchor="start" >load, always this way</text>
<text class="g-b" x="570" y="440" text-anchor="middle" >Case 2: the outer ring turns</text>
<text class="g-t" x="570" y="459" text-anchor="middle" >idler pulley or wheel on a fixed pin</text>
<text class="g-t" x="570" y="478" text-anchor="middle" >outer ring turns, load stays still</text>
<text class="g-b" x="570" y="497" text-anchor="middle" >outer ring tight: bore K7</text>
<text class="g-t" x="570" y="516" text-anchor="middle" >inner ring normal: pin h6 or g6</text>
<rect x="300" y="530" width="18" height="12" fill="#c0392b" fill-opacity=".4" stroke="#c0392b"/>
<text class="g-s" x="326" y="541" text-anchor="start" >red = the ring that needs the tight fit</text>
<rect x="300" y="550" width="18" height="12" fill="#2f6fde" fill-opacity=".4" stroke="#2f6fde"/>
<text class="g-s" x="326" y="561" text-anchor="start" >blue = normal fit. Red arrow = what turns.</text>
</svg>
