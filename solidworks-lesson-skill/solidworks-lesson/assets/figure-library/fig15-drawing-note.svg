<svg xmlns="http://www.w3.org/2000/svg" id="svg-drw" viewBox="0 0 760 545" width="760" height="545" role="img" aria-label="Corner of a drawing with the ISO 2768-m general tolerance note and the title block">
<title>Corner of a drawing with the ISO 2768-m general tolerance note and the title block</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-drw" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-drw" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-drw" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-drw" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-drw" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<pattern id="hR-drw" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-60)"><rect width="5" height="5" fill="#f4f5f7"/><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2733" stroke-width="0.9"/></pattern>
<marker id="dot-drw" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-drw" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-drw" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-drw" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-drw" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="545" fill="#ffffff"/>
<text class="g-h" x="30" y="30" text-anchor="start" >Bottom right corner of a drawing sheet (folha de desenho)</text>
<rect x="250" y="50" width="495" height="420" fill="#ffffff" stroke="#1f2733" stroke-width="2.2"/>
<rect x="290" y="90" width="200" height="110" fill="none" stroke="#1f2733" stroke-width="2"/>
<circle cx="390" cy="145" r="18" fill="none" stroke="#1f2733" stroke-width="2"/>
<line class="g-cl" x1="362" y1="145" x2="418" y2="145" /><line class="g-cl" x1="390" y1="117" x2="390" y2="173" />
<line class="g-thin" x1="290" y1="205" x2="290" y2="235" /><line class="g-thin" x1="490" y1="205" x2="490" y2="235" />
<line class="g-thin" x1="290" y1="228" x2="490" y2="228" marker-start="url(#arrs-drw)" marker-end="url(#arr-drw)"/>
<text class="g-t" x="390" y="222" text-anchor="middle" >100</text>
<polyline class="g-thin" points="403,132 440,97 510,97" marker-start="url(#arrs-drw)"/>
<text class="g-t" x="446" y="90" text-anchor="start" >Ø10 H7</text>
<text class="g-b" x="280" y="300" text-anchor="start" >NOTES:</text>
<text x="280" y="322" style="font:13px Arial;fill:#1f2733">1. UNLESS OTHERWISE STATED:</text>
<text x="296" y="340" style="font:13px Arial;fill:#1f2733">GENERAL TOLERANCES ISO 2768-m</text>
<text x="280" y="360" style="font:13px Arial;fill:#1f2733">2. BREAK ALL SHARP EDGES 0.3 MAX</text>
<text x="296" y="378" style="font:13px Arial;fill:#1f2733">(QUEBRAR CANTOS VIVOS)</text>
<rect x="540" y="385" width="205" height="85" fill="#f7f8fa" stroke="#1f2733" stroke-width="2"/>
<line class="g-thin" x1="540" y1="413" x2="745" y2="413" />
<line class="g-thin" x1="540" y1="450" x2="745" y2="450" />
<line class="g-thin" x1="640" y1="413" x2="640" y2="470" />
<text x="548" y="405" style="font:700 13px Arial;fill:#1f2733">FIXTURE PLATE  FP-01</text>
<text x="548" y="428" style="font:11px Arial;fill:#4a5566">MATERIAL</text><text x="548" y="444" style="font:12px Arial;fill:#1f2733">SAE 1045</text>
<text x="648" y="428" style="font:11px Arial;fill:#4a5566">SCALE</text><text x="648" y="444" style="font:12px Arial;fill:#1f2733">1:1</text>
<text x="548" y="465" style="font:11px Arial;fill:#4a5566">DRAWN: ADEL</text><text x="648" y="465" style="font:11px Arial;fill:#4a5566">SHEET 1/1  A4</text>
<polyline class="g-thin" points="436,80 420,62 230,62" marker-start="url(#dot-drw)"/>
<text class="g-b" x="30" y="66" text-anchor="start" >Fit written on the size</text>
<text class="g-t" x="30" y="84" text-anchor="start" >the note does not apply here</text>
<polyline class="g-thin" points="340,228 230,170" marker-start="url(#dot-drw)"/>
<text class="g-b" x="30" y="166" text-anchor="start" >No tolerance written</text>
<text class="g-t" x="30" y="184" text-anchor="start" >the note gives it: ±0.3</text>
<text class="g-t" x="30" y="202" text-anchor="start" >(30 to 120 mm, class m)</text>
<polyline class="g-thin" points="276,318 230,300" marker-start="url(#dot-drw)"/>
<text class="g-b" x="30" y="296" text-anchor="start" >General tolerance note</text>
<text class="g-t" x="30" y="314" text-anchor="start" >covers every size with</text>
<text class="g-t" x="30" y="332" text-anchor="start" >no tolerance of its own</text>
<text class="g-s g-pt" x="30" y="350" text-anchor="start" >nota de tolerância geral</text>
<polyline class="g-thin" points="540,450 500,500 230,500" marker-start="url(#dot-drw)"/>
<text class="g-b" x="30" y="496" text-anchor="start" >Title block (legenda)</text>
<text class="g-t" x="30" y="514" text-anchor="start" >put the notes near it</text>
</svg>
