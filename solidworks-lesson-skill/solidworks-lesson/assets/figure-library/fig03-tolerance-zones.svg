<svg xmlns="http://www.w3.org/2000/svg" id="svg-zones" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Tolerance bands of H7, g6, h6, k6 and p6 at 10 mm">
<title>Tolerance bands of H7, g6, h6, k6 and p6 at 10 mm</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-zones" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-zones" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-zones" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-zones" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-zones" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<pattern id="hR-zones" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-60)"><rect width="5" height="5" fill="#f4f5f7"/><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2733" stroke-width="0.9"/></pattern>
<marker id="dot-zones" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-zones" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-zones" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-zones" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-zones" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text class="g-h" x="380" y="32" text-anchor="middle" >Ø10: one hole band and four shaft bands (1 µm = 0.001 mm)</text>
<line class="g-ink" x1="80" y1="53" x2="80" y2="347" />
<line class="g-thin" x1="73" y1="95" x2="80" y2="95" />
<text class="g-s" x="68" y="100" text-anchor="end" >+20</text>
<line class="g-thin" x1="73" y1="165" x2="80" y2="165" />
<text class="g-s" x="68" y="170" text-anchor="end" >+10</text>
<line class="g-thin" x1="73" y1="235" x2="80" y2="235" />
<text class="g-s" x="68" y="240" text-anchor="end" >0</text>
<line class="g-thin" x1="73" y1="305" x2="80" y2="305" />
<text class="g-s" x="68" y="310" text-anchor="end" >-10</text>
<text class="g-s" x="68" y="49" text-anchor="end" >µm</text>
<line class="g-cl" x1="80" y1="235" x2="612" y2="235" style="stroke-width:1.6"/>
<rect x="120" y="130" width="66" height="105" fill="#2f6fde" fill-opacity=".30" stroke="#2f6fde" stroke-width="1.8"/>
<text class="g-b" x="153" y="372" text-anchor="middle" >H7 hole</text>
<text class="g-s" x="153" y="390" text-anchor="middle" >max 10.015</text>
<text class="g-s" x="153" y="408" text-anchor="middle" >min 10.000</text>
<rect x="225" y="270" width="66" height="63" fill="#1f8a4c" fill-opacity=".30" stroke="#1f8a4c" stroke-width="1.8"/>
<text class="g-b" x="258" y="372" text-anchor="middle" >g6 shaft</text>
<text class="g-s" x="258" y="390" text-anchor="middle" >max 9.995</text>
<text class="g-s" x="258" y="408" text-anchor="middle" >min 9.986</text>
<rect x="325" y="235" width="66" height="63" fill="#1f8a4c" fill-opacity=".30" stroke="#1f8a4c" stroke-width="1.8"/>
<text class="g-b" x="358" y="372" text-anchor="middle" >h6 shaft</text>
<text class="g-s" x="358" y="390" text-anchor="middle" >max 10.000</text>
<text class="g-s" x="358" y="408" text-anchor="middle" >min 9.991</text>
<rect x="425" y="165" width="66" height="63" fill="#c8761a" fill-opacity=".30" stroke="#c8761a" stroke-width="1.8"/>
<text class="g-b" x="458" y="372" text-anchor="middle" >k6 shaft</text>
<text class="g-s" x="458" y="390" text-anchor="middle" >max 10.010</text>
<text class="g-s" x="458" y="408" text-anchor="middle" >min 10.001</text>
<rect x="525" y="67" width="66" height="63" fill="#c0392b" fill-opacity=".30" stroke="#c0392b" stroke-width="1.8"/>
<text class="g-b" x="558" y="372" text-anchor="middle" >p6 shaft</text>
<text class="g-s" x="558" y="390" text-anchor="middle" >max 10.024</text>
<text class="g-s" x="558" y="408" text-anchor="middle" >min 10.015</text>
<line class="g-thin" x1="632" y1="120" x2="632" y2="80" marker-end="url(#arr-zones)"/>
<text class="g-s" x="642" y="100" text-anchor="start" >up =</text>
<text class="g-s" x="642" y="119" text-anchor="start" >bigger size</text>
<line class="g-thin" x1="632" y1="300" x2="632" y2="340" marker-end="url(#arr-zones)"/>
<text class="g-s" x="642" y="318" text-anchor="start" >down =</text>
<text class="g-s" x="642" y="337" text-anchor="start" >smaller size</text>
<polyline class="g-thin" points="600,235 640,200" marker-start="url(#dot-zones)"/>
<text class="g-s" x="646" y="196" text-anchor="start" >dash-dot line =</text>
<text class="g-s" x="646" y="215" text-anchor="start" >10.000 exactly</text>
</svg>
