<svg xmlns="http://www.w3.org/2000/svg" id="svg-um" viewBox="0 0 760 485" width="760" height="485" role="img" aria-label="15 micrometres next to a hair and a sheet of paper">
<title>15 micrometres next to a hair and a sheet of paper</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-um" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-um" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-um" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-um" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-um" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<pattern id="hR-um" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-60)"><rect width="5" height="5" fill="#f4f5f7"/><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2733" stroke-width="0.9"/></pattern>
<marker id="dot-um" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-um" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-um" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-um" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-um" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="485" fill="#ffffff"/>
<text class="g-h" x="380" y="38" text-anchor="middle" >How big is a tolerance? All four drawn at the same scale.</text>
<rect x="70" y="80" width="100" height="300" fill="#eef0f3" stroke="#1f2733" stroke-width="1.6"/>
<circle cx="365" cy="275" r="105" fill="#b08a62" stroke="#5a4028" stroke-width="1.6"/>
<rect x="535" y="335" width="80" height="45" fill="#2f6fde" fill-opacity=".35" stroke="#2f6fde" stroke-width="1.6"/>
<rect x="675" y="365" width="50" height="15" fill="#1f8a4c" fill-opacity=".45" stroke="#1f8a4c" stroke-width="1.6"/>
<line class="g-thin" x1="40" y1="380" x2="730" y2="380" />
<line class="g-thin" x1="190" y1="80" x2="190" y2="380" marker-start="url(#arrs-um)" marker-end="url(#arr-um)"/>
<text class="g-b" x="198" y="230" text-anchor="start" >100 µm</text>
<line class="g-thin" x1="485" y1="170" x2="485" y2="380" marker-start="url(#arrs-um)" marker-end="url(#arr-um)"/>
<text class="g-b" x="493" y="275" text-anchor="start" >70 µm</text>
<line class="g-thin" x1="632" y1="335" x2="632" y2="380" marker-start="url(#arrs-um)" marker-end="url(#arr-um)"/>
<text class="g-b" x="638" y="370" text-anchor="start" >15</text>
<text class="g-b" x="120" y="408" text-anchor="middle" >Sheet of paper</text>
<text class="g-t" x="120" y="427" text-anchor="middle" >seen from its edge</text>
<text class="g-s g-pt" x="120" y="446" text-anchor="middle" >folha de papel</text>
<text class="g-b" x="365" y="408" text-anchor="middle" >Human hair</text>
<text class="g-t" x="365" y="427" text-anchor="middle" >cut across</text>
<text class="g-s g-pt" x="365" y="446" text-anchor="middle" >fio de cabelo</text>
<text class="g-b" x="575" y="408" text-anchor="middle" >Whole H7 band</text>
<text class="g-t" x="575" y="427" text-anchor="middle" >at Ø10: 15 µm</text>
<text class="g-s g-pt" x="575" y="446" text-anchor="middle" >campo de tolerância</text>
<text class="g-b" x="702" y="408" text-anchor="middle" >Smallest gap</text>
<text class="g-t" x="702" y="427" text-anchor="middle" >H7/g6: 5 µm</text>
<text class="g-s g-pt" x="702" y="446" text-anchor="middle" >folga mínima</text>
<text class="g-s" x="40" y="470" text-anchor="start" >1 µm (one micrometre, mícron) = 0.001 mm. The H7 band is about 1/5 of a hair.</text>
</svg>
