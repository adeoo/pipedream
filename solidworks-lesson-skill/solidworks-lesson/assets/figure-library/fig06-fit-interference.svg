<svg xmlns="http://www.w3.org/2000/svg" id="svg-fint" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Interference fit: shaft bigger than hole, overlap shown in red">
<title>Interference fit: shaft bigger than hole, overlap shown in red</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-fint" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-fint" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-fint" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-fint" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-fint" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<pattern id="hR-fint" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-60)"><rect width="5" height="5" fill="#f4f5f7"/><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2733" stroke-width="0.9"/></pattern>
<marker id="dot-fint" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-fint" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-fint" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-fint" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-fint" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text class="g-h" x="40" y="36" text-anchor="start" >Interference fit, H7/p6 at Ø10</text>
<text class="g-s g-pt" x="40" y="58" text-anchor="start" >ajuste com interferência: the shaft is always bigger than the hole</text>
<path d="M75,80 h250 v250 h-250 Z M110,205 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 Z" fill="url(#hA-fint)" fill-rule="evenodd" stroke="#1f2733" stroke-width="2"/>
<circle cx="200" cy="205" r="104" fill="url(#hS-fint)" stroke="#1f8a4c" stroke-width="2.4" stroke-dasharray="9 5"/>
<path d="M96,205 a104,104 0 1,0 208,0 a104,104 0 1,0 -208,0 Z M110,205 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 Z" fill="#c0392b" fill-opacity=".55" fill-rule="evenodd"/>
<circle cx="200" cy="205" r="90" fill="none" stroke="#2f6fde" stroke-width="2.4"/>
<line class="g-cl" x1="60" y1="205" x2="340" y2="205" /><line class="g-cl" x1="200" y1="65" x2="200" y2="345" />
<polyline class="g-thin" points="300,100 400,100 410,100" marker-start="url(#dot-fint)"/>
<text class="g-b" x="418" y="95" text-anchor="start" >Plate or hub, cut</text>
<text class="g-s g-pt" x="418" y="114" text-anchor="start" >peça em corte</text>
<polyline class="g-thin" points="277.9,160.0 400,160 410,160" marker-start="url(#dot-fint)"/>
<text class="g-b" x="418" y="155" text-anchor="start" >Hole Ø10 H7</text>
<text class="g-t" x="418" y="174" text-anchor="start" >10.000 to 10.015 mm</text>
<text class="g-s g-pt" x="418" y="193" text-anchor="start" >furo</text>
<polyline class="g-thin" points="230,245 400,250 410,250" marker-start="url(#dot-fint)"/>
<text class="g-b" x="418" y="245" text-anchor="start" >Shaft Ø10 p6, before press</text>
<text class="g-t" x="418" y="264" text-anchor="start" >10.015 to 10.024 mm</text>
<text class="g-s g-pt" x="418" y="283" text-anchor="start" >eixo, antes de prensar</text>
<polyline class="g-thin" points="274.3,267.4 400,330 410,330" marker-start="url(#dot-fint)"/>
<text class="g-b" x="418" y="325" text-anchor="start" >Red ring = interference</text>
<text class="g-t" x="418" y="344" text-anchor="start" >0 to 24 µm of metal that</text>
<text class="g-t" x="418" y="363" text-anchor="start" >must squeeze. This grip</text>
<text class="g-t" x="418" y="382" text-anchor="start" >holds the shaft.</text>
<text class="g-s" x="40" y="405" text-anchor="start" >Dashed green = the shaft before you press it. Blue = the hole wall. Not to scale.</text>
</svg>
