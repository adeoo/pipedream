<svg xmlns="http://www.w3.org/2000/svg" id="svg-ucp" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="UCP pillow block unit with its parts named">
<title>UCP pillow block unit with its parts named</title>
<style>
