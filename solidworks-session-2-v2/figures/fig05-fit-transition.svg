<svg xmlns="http://www.w3.org/2000/svg" id="svg-ftr" viewBox="0 0 760 425" width="760" height="425" role="img" aria-label="Transition fit: small gap in one case, small press in the other">
<title>Transition fit: small gap in one case, small press in the other</title>
<style>
.g-ink{stroke:#1f2733;fill:none;stroke-width:2}
.g-thin{stroke:#1f2733;fill:none;stroke-width:1.1}
.g-cl{stroke:#1f2733;fill:none;stroke-width:1.1;stroke-dasharray:18 4 3 4}
.g-hid{stroke:#1f2733;fill:none;stroke-width:1.5;stroke-dasharray:7 4}
.g-t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f2733}
.g-b{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#1f2733}
.g-s{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#4a5566}
.g-h{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2733}
.g-pt{font-style:italic}
</style>
<defs>
<pattern id="hA-ftr" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hB-ftr" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1f2733" stroke-width="1"/></pattern>
<pattern id="hS-ftr" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#eaf5ee"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f8a4c" stroke-width="1.1"/></pattern>
<pattern id="hC-ftr" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f6e7d3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a86b2d" stroke-width="1.2"/></pattern>
<pattern id="hG-ftr" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f2733" stroke-width="1"/><line x1="5" y1="0" x2="5" y2="10" stroke="#1f2733" stroke-width="0.5"/></pattern>
<marker id="dot-ftr" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#1f2733"/></marker>
<marker id="arr-ftr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="arrs-ftr" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,5 L12,10 z" fill="#1f2733"/></marker>
<marker id="arrR-ftr" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#c0392b"/></marker>
<marker id="arrB-ftr" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 z" fill="#2f6fde"/></marker>
</defs>
<rect x="0" y="0" width="760" height="425" fill="#ffffff"/>
<text class="g-h" x="40" y="36" text-anchor="start" >Transition fit, H7/k6 at Ø10</text>
<text class="g-s g-pt" x="40" y="58" text-anchor="start" >ajuste incerto: sometimes a tiny gap, sometimes a tiny press</text>
<path d="M50,100 h200 v200 h-200 Z M74,200 a76,76 0 1,0 152,0 a76,76 0 1,0 -152,0 Z" fill="url(#hA-ftr)" fill-rule="evenodd" stroke="#1f2733" stroke-width="2"/>
<circle cx="150" cy="200" r="76" fill="#fff1b8" stroke="#2f6fde" stroke-width="2.4"/>
<circle cx="150" cy="200" r="64" fill="url(#hS-ftr)" stroke="#1f8a4c" stroke-width="2.4"/>
<line class="g-cl" x1="35" y1="200" x2="265" y2="200" /><line class="g-cl" x1="150" y1="85" x2="150" y2="315" />
<path d="M340,100 h200 v200 h-200 Z M364,200 a76,76 0 1,0 152,0 a76,76 0 1,0 -152,0 Z" fill="url(#hA-ftr)" fill-rule="evenodd" stroke="#1f2733" stroke-width="2"/>
<circle cx="440" cy="200" r="84" fill="url(#hS-ftr)" stroke="#1f8a4c" stroke-width="2.4"/>
<path d="M356,200 a84,84 0 1,0 168,0 a84,84 0 1,0 -168,0 Z M364,200 a76,76 0 1,0 152,0 a76,76 0 1,0 -152,0 Z" fill="#c0392b" fill-opacity=".55" fill-rule="evenodd"/>
<circle cx="440" cy="200" r="76" fill="none" stroke="#2f6fde" stroke-width="2" stroke-dasharray="6 4"/>
<line class="g-cl" x1="325" y1="200" x2="555" y2="200" /><line class="g-cl" x1="440" y1="85" x2="440" y2="315" />
<text class="g-b" x="150" y="335" text-anchor="middle" >Case A</text>
<text class="g-t" x="150" y="354" text-anchor="middle" >biggest hole, smallest shaft</text>
<text class="g-t" x="150" y="373" text-anchor="middle" >gap up to 14 µm</text>
<text class="g-b" x="440" y="335" text-anchor="middle" >Case B</text>
<text class="g-t" x="440" y="354" text-anchor="middle" >smallest hole, biggest shaft</text>
<text class="g-t" x="440" y="373" text-anchor="middle" >press up to 10 µm</text>
<polyline class="g-thin" points="199.5,150.5 268,90 290,90" marker-start="url(#dot-ftr)"/>
<text class="g-b" x="296" y="95" text-anchor="start" >gap</text>
<polyline class="g-thin" points="501.3,148.6 566,110 580,110" marker-start="url(#dot-ftr)"/>
<text class="g-b" x="586" y="106" text-anchor="start" >red ring =</text>
<text class="g-t" x="586" y="125" text-anchor="start" >overlap, the</text>
<text class="g-t" x="586" y="144" text-anchor="start" >parts squeeze</text>
<text class="g-b" x="586" y="190" text-anchor="start" >Hole H7</text>
<text class="g-t" x="586" y="209" text-anchor="start" >10.000 to 10.015</text>
<text class="g-b" x="586" y="228" text-anchor="start" >Shaft k6</text>
<text class="g-t" x="586" y="247" text-anchor="start" >10.001 to 10.010</text>
<text class="g-s" x="586" y="290" text-anchor="start" >You only know</text>
<text class="g-s" x="586" y="309" text-anchor="start" >which case you</text>
<text class="g-s" x="586" y="328" text-anchor="start" >get when you</text>
<text class="g-s" x="586" y="347" text-anchor="start" >measure the parts.</text>
<text class="g-s" x="40" y="410" text-anchor="start" >Sizes drawn hundreds of times bigger than real. Dashed blue circle = where the hole wall is.</text>
</svg>
