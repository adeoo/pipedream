<text class="g-b" x="30" y="97" text-anchor="start" >Fixture plate, 12 mm</text>
<polyline class="g-thin" points="120,373 40,453" marker-start="url(#dot-dws)"/>
<text class="g-b" x="30" y="471" text-anchor="start" >Base, 20 mm</text>
