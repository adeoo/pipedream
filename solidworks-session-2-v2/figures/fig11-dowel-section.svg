<svg xmlns="http://www.w3.org/2000/svg" id="svg-dws" viewBox="0 0 760 605" width="760" height="605" role="img" aria-label="Dowel pin in two plates, section view, with engagement depth">
<title>Dowel pin in two plates, section view, with engagement depth</title>
<style>
