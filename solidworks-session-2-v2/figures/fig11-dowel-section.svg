<text class="g-b" x="386" y="57" text-anchor="start" >Pin Ø8 m6, ISO 8734</text>
<text class="g-t" x="386" y="75" text-anchor="start" >8.006 to 8.015 mm</text>
<text class="g-s g-pt" x="386" y="93" text-anchor="start" >pino de guia, temperado e retificado</text>
<polyline class="g-thin" points="301,383 400,483 420,483" marker-start="url(#dot-dws)"/>
<text class="g-b" x="426" y="479" text-anchor="start" >Holes Ø8 H7, reamed through</text>
<text class="g-t" x="426" y="497" text-anchor="start" >8.000 to 8.015 mm</text>
<text class="g-s g-pt" x="426" y="515" text-anchor="start" >furo alargado, passante</text>
<text class="g-b" x="265" y="483" text-anchor="middle" >d = 8</text>
<text class="g-s" x="30" y="590" text-anchor="start" >The pin is not hatched: by drawing rules, pins and shafts cut along their axis are drawn plain.</text>
